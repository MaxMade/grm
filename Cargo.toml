[package]
name = "grm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Installs and updates releases published in Git repositories"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
libc = "0.2.191"
log = "0.4.35"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
