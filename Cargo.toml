[package]
name = "grm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Installs and updates releases published in Git repositories"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
flate2 = "1.1.11"
libc = "0.2.191"
log = "0.4.35"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.1.8"
ureq = "3.5.1"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2"] }
