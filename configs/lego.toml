# Example grm configuration for https://github.com/go-acme/lego.
# Commented-out keys are optional and show their defaults.

[repository]
# URL of the repository's release page.
url = "https://github.com/go-acme/lego/releases"
# Hosting service; derived from the URL's host if omitted.
# type = "github"

[installation]
# File name of the installed binary.
name = "lego"
# Directory the binary is installed to (default: ~/.local/bin, or
# /usr/local/bin as root).
# dir = "/home/user/.local/bin"
# Permission bits of the installed binary.
# mode = 0o755
# Directory for the lock file preventing concurrent runs
# (default: $XDG_RUNTIME_DIR/grm, or /run/grm as root).
# runtime_dir = "/run/user/1000/grm"
# Directory storing the record of installed programs
# (default: $XDG_DATA_HOME/grm or ~/.local/share/grm, or /var/lib/grm as root).
# data_dir = "/home/user/.local/share/grm"

[asset]
# Regular expression matching the version, with the named capture groups
# `major`, `minor` and `patch`. Single quotes make this a TOML literal
# string, so backslashes need no escaping.
version = '(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)'
# File name of the release asset to install. `${name}` (or `$name`) is
# replaced by the capture group `name` of `version`, `$$` is a literal `$`.
target = 'lego_v${major}.${minor}.${patch}_linux_amd64.tar.gz'
# File to install from the asset if it is an archive (.tar.gz, .tgz or .zip),
# as a path inside the archive; may refer to capture groups like `target`.
# Without it, the asset itself is installed.
unpack = 'lego'
